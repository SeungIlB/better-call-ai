services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-legal_ai}
      DATABASE_APP_USER: legal_ai_app
      DATABASE_AUTH_USER: legal_ai_auth
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-legal_ai_migrator}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      SERVER_PORT: 8080
      UPLOAD_TEMP_DIR: /app/storage/temp-originals
      SERVER_TOMCAT_BASEDIR: /app/build/tomcat
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - better-call-ai-originals:/app/storage/temp-originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - better-call-ai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${DATABASE_MIGRATION_USER:-legal_ai_migrator}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
      DATABASE_AUTH_PASSWORD: ${DATABASE_AUTH_PASSWORD:?DATABASE_AUTH_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - better-call-ai-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_MIGRATION_USER:-legal_ai_migrator} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  better-call-ai-originals:
  better-call-ai-redis:
  better-call-ai-postgres:
