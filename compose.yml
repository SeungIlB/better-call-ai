services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-legal_ai}
      DATABASE_APP_USER: legal_ai_app
      DATABASE_AUTH_USER: legal_ai_auth
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-legal_ai_migrator}
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PORT: 8080
      SERVER_PORT: 8080
      UPLOAD_TEMP_DIR: /app/storage/temp-originals
      SERVER_TOMCAT_BASEDIR: /app/build/tomcat
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - better-call-ai-originals:/app/storage/temp-originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - better-call-ai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 20M
      CLAMD_CONF_MaxFileSize: 20M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_MaxRecursion: "10"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxScanTime: "8000"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_MaxQueue: "4"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_LogClean: "no"
      CLAMD_CONF_LogVerbose: "no"
      CLAMD_CONF_LeaveTemporaryFiles: "no"
      FRESHCLAM_CHECKS: "12"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - better-call-ai-clamav:/var/lib/clamav
    tmpfs:
      - /tmp:size=268435456,noexec,nosuid,nodev
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${DATABASE_MIGRATION_USER:-legal_ai_migrator}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
      DATABASE_AUTH_PASSWORD: ${DATABASE_AUTH_PASSWORD:?DATABASE_AUTH_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - better-call-ai-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_MIGRATION_USER:-legal_ai_migrator} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  better-call-ai-originals:
  better-call-ai-redis:
  better-call-ai-clamav:
  better-call-ai-postgres:
