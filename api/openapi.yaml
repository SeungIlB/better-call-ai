openapi: 3.1.0
info:
  title: Better Call AI API
  version: 0.1.0
  description: 1인 1사건 소유권과 사용자 확인을 중심으로 한 MVP 계약
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwkSet
      summary: JWT 검증 공개키 조회
      security: []
      responses:
        '200':
          description: JSON Web Key Set
  /api/v1/auth/register:
    post:
      operationId: register
      summary: 로컬 계정 회원가입 및 Token Pair 발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 계정 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 이미 가입된 이메일
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 로컬 계정 로그인
      description: >
        정규화 이메일별 연속 실패 5회부터 15분간 429 AUTH_008을 반환한다.
        미가입 이메일에도 동일하게 적용하며 잠금 중 요청은 만료 시각을 연장하지 않는다.
        성공 또는 잠금 만료 후 실패 횟수를 초기화한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 로그인 실패 제한 (AUTH_008). 잠금이 해제될 때까지 재시도를 중단한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh Token 1회성 회전
      description: >
        동일 토큰의 동시 재발급도 재사용으로 판단하여 해당 계정의 모든 Refresh Token을 폐기한다.
        클라이언트는 재발급 요청을 한 번만 실행하며 AUTH_006이면 다시 로그인한다.
        이미 발급된 Access Token은 만료 전까지 유효하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 새 Token Pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 현재 Refresh Token 폐기
      description: >
        반복 요청은 204로 처리하며 다른 사용자의 토큰에는 영향을 주지 않는다.
        이미 발급된 Access Token은 만료 전까지 유효하다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204':
          description: 로그아웃 처리됨
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: 인증 사용자 정보 조회
      responses:
        '200':
          description: 내 사용자 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/cases:
    get:
      operationId: listCases
      summary: 내 활성 사건 목록 조회
      description: >
        삭제되지 않은 본인 사건만 updatedAt 내림차순, 동일 시각에는 id 내림차순으로 반환한다.
        긴 진술과 목표 본문은 제외한다. 전체 건수 대신 hasNext를 제공하며 페이지는 1부터 시작한다.
        페이지 사이 사건이 추가·수정·삭제되면 위치가 바뀔 수 있으므로 목록을 새로 조회한다.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 사건 요약 목록. 유효한 페이지 값이지만 해당 위치에 사건이 없으면 빈 배열과 hasNext=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePageSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCase
      summary: 사건 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    delete:
      operationId: deleteCase
      summary: 내 사건 논리 삭제
      description: >
        삭제 표시와 CASE_DELETED 이벤트를 하나의 트랜잭션에 기록한다.
        사건 및 연결 데이터는 즉시 접근 차단되며 기본 7일 뒤 영구 삭제 가능한 시각을 저장한다.
        영구 삭제 배치 및 객체 저장소 파기 작업은 아직 미구현이므로 204는 물리 삭제 완료를 의미하지 않는다.
        현재 버전을 기준으로 삭제하며 반복 삭제, 없는 사건, 타인 사건은 모두 404를 반환한다.
      responses:
        '204':
          description: 논리 삭제 완료. 응답 본문 없음
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: getCase
      summary: 내 사건 조회
      responses:
        '200':
          description: 사건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSuccess' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCase
      summary: 사건 진술 수정 및 기존 분석 stale 처리
      description: >
        소유자는 JWT sub로만 식별한다. 입력 검증을 통과한 요청에서 타인 소유 또는 없는 사건은 기대 버전 일치 여부와 관계없이 404를 반환한다.
        소유자 요청에서만 오래된 버전을 409로 구분하며 거부된 요청은 사건과 outbox를 변경하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSuccess' }
        '409':
          description: version 충돌
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/cases/{caseId}/files:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: createFileUpload
      summary: 원본 파일 업로드 세션 생성
      responses:
        '201':
          description: 업로드 세션
  /api/v1/cases/{caseId}/files/{fileId}/ocr-revisions:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: saveOcrRevision
      summary: OCR 수정본 저장
      responses:
        '201':
          description: 수정본 생성
  /api/v1/cases/{caseId}/analyses:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: requestAnalysis
      summary: 현재 확인본으로 분석 요청
      responses:
        '202':
          description: 분석 요청 접수
  /api/v1/cases/{caseId}/documents:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: generateDocument
      summary: 현재 유효한 분석으로 문서 생성
      responses:
        '202':
          description: 문서 생성 접수
  /api/v1/legal-data/{type}:
    parameters:
      - $ref: '#/components/parameters/LegalDocumentType'
    get:
      operationId: searchLegalData
      summary: 법제처 공개 법령·판례 검색
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 정규화된 검색 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSearchSuccess' }
        '502':
          description: 국가법령정보 공동활용 API 호출 또는 응답 처리 실패
        '503':
          description: 국가법령정보 공동활용 API 식별자 미설정
  /api/v1/legal-data/{type}/{externalId}:
    parameters:
      - $ref: '#/components/parameters/LegalDocumentType'
      - name: externalId
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
    get:
      operationId: getLegalDocument
      summary: 법제처 공개 법령·판례 본문 조회 및 정규화
      responses:
        '200':
          description: 정규화된 법률 문서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentSuccess' }
        '502':
          description: 국가법령정보 공동활용 API 호출 또는 응답 처리 실패
        '503':
          description: 국가법령정보 공동활용 API 식별자 미설정
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LegalDocumentType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [law, precedent] }
  responses:
    Unauthorized:
      description: JWT가 없거나 서명·만료·발급자·대상자 검증에 실패함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 없거나 접근할 수 없는 자원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName, termsAccepted, privacyAccepted]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        termsAccepted: { type: boolean, const: true }
        privacyAccepted: { type: boolean, const: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 72 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 500 }
    AuthToken:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    AuthTokenSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthToken' }
        traceId: { type: [string, 'null'] }
    UserSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/User' }
        traceId: { type: [string, 'null'] }
    CreateCaseRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        userPartyRole: { type: [string, 'null'], maxLength: 40 }
        userGoal: { type: [string, 'null'], maxLength: 2000 }
        originalStatement: { type: [string, 'null'], maxLength: 50000 }
    UpdateCaseRequest:
      type: object
      required: [originalStatement, expectedVersion]
      properties:
        originalStatement: { type: string, minLength: 1, maxLength: 50000 }
        expectedVersion: { type: integer, minimum: 1 }
    Case:
      type: object
      required: [id, title, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, COLLECTING, REVIEW_READY, ANALYZING, READY, CLOSED] }
        userPartyRole: { type: [string, 'null'] }
        userGoal: { type: [string, 'null'] }
        originalStatement: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Case' }
        traceId: { type: [string, 'null'] }
    CaseSummary:
      type: object
      required: [id, title, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, COLLECTING, REVIEW_READY, ANALYZING, READY, CLOSED] }
        userPartyRole: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CasePage:
      type: object
      required: [items, page, pageSize, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        page: { type: integer, minimum: 1, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
    CasePageSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/CasePage' }
        traceId: { type: [string, 'null'] }
    LegalSearchItem:
      type: object
      required: [externalId, title]
      properties:
        externalId: { type: string }
        title: { type: string }
        caseNumber: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        publishedOrDecisionDate: { type: [string, 'null'], format: date }
        effectiveDate: { type: [string, 'null'], format: date }
        sourceUrl: { type: [string, 'null'], format: uri }
    LegalSearchResult:
      type: object
      required: [type, query, page, pageSize, totalCount, items]
      properties:
        type: { type: string, enum: [LAW, PRECEDENT] }
        query: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/LegalSearchItem' }
    LegalSearchSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LegalSearchResult' }
        traceId: { type: [string, 'null'] }
    LegalDocument:
      allOf:
        - $ref: '#/components/schemas/LegalSearchItem'
        - type: object
          required: [type, normalizedText]
          properties:
            type: { type: string, enum: [LAW, PRECEDENT] }
            normalizedText: { type: string }
    LegalDocumentSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LegalDocument' }
        traceId: { type: [string, 'null'] }
    ApiError:
      type: object
      required: [success, code, message, occurredAt]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        message: { type: string }
        traceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
