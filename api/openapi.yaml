openapi: 3.1.0
info:
  title: Better Call AI API
  version: 0.1.0
  description: 1인 1사건 소유권과 사용자 확인을 중심으로 한 MVP 계약
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/cases:
    post:
      operationId: createCase
      summary: 사건 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getCase
      summary: 내 사건 조회
      responses:
        '200':
          description: 사건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSuccess' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCase
      summary: 사건 진술 수정 및 기존 분석 stale 처리
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSuccess' }
        '409':
          description: version 충돌
  /api/v1/cases/{caseId}/files:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: createFileUpload
      summary: 원본 파일 업로드 세션 생성
      responses:
        '201':
          description: 업로드 세션
  /api/v1/cases/{caseId}/files/{fileId}/ocr-revisions:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: saveOcrRevision
      summary: OCR 수정본 저장
      responses:
        '201':
          description: 수정본 생성
  /api/v1/cases/{caseId}/analyses:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: requestAnalysis
      summary: 현재 확인본으로 분석 요청
      responses:
        '202':
          description: 분석 요청 접수
  /api/v1/cases/{caseId}/documents:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: generateDocument
      summary: 현재 유효한 분석으로 문서 생성
      responses:
        '202':
          description: 문서 생성 접수
  /api/v1/legal-data/{type}:
    parameters:
      - $ref: '#/components/parameters/LegalDocumentType'
    get:
      operationId: searchLegalData
      summary: 법제처 공개 법령·판례 검색
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 정규화된 검색 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSearchSuccess' }
        '502':
          description: 국가법령정보 공동활용 API 호출 또는 응답 처리 실패
        '503':
          description: 국가법령정보 공동활용 API 식별자 미설정
  /api/v1/legal-data/{type}/{externalId}:
    parameters:
      - $ref: '#/components/parameters/LegalDocumentType'
      - name: externalId
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
    get:
      operationId: getLegalDocument
      summary: 법제처 공개 법령·판례 본문 조회 및 정규화
      responses:
        '200':
          description: 정규화된 법률 문서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentSuccess' }
        '502':
          description: 국가법령정보 공동활용 API 호출 또는 응답 처리 실패
        '503':
          description: 국가법령정보 공동활용 API 식별자 미설정
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LegalDocumentType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [law, precedent] }
  responses:
    Unauthorized:
      description: JWT가 없거나 서명·만료·발급자·대상자 검증에 실패함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 없거나 접근할 수 없는 자원
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    CreateCaseRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        userPartyRole: { type: [string, 'null'], maxLength: 40 }
        userGoal: { type: [string, 'null'], maxLength: 2000 }
        originalStatement: { type: [string, 'null'], maxLength: 50000 }
    UpdateCaseRequest:
      type: object
      required: [originalStatement, expectedVersion]
      properties:
        originalStatement: { type: string, minLength: 1, maxLength: 50000 }
        expectedVersion: { type: integer, minimum: 1 }
    Case:
      type: object
      required: [id, title, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, COLLECTING, REVIEW_READY, ANALYZING, READY, CLOSED] }
        userPartyRole: { type: [string, 'null'] }
        userGoal: { type: [string, 'null'] }
        originalStatement: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Case' }
        traceId: { type: [string, 'null'] }
    LegalSearchItem:
      type: object
      required: [externalId, title]
      properties:
        externalId: { type: string }
        title: { type: string }
        caseNumber: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        publishedOrDecisionDate: { type: [string, 'null'], format: date }
        effectiveDate: { type: [string, 'null'], format: date }
        sourceUrl: { type: [string, 'null'], format: uri }
    LegalSearchResult:
      type: object
      required: [type, query, page, pageSize, totalCount, items]
      properties:
        type: { type: string, enum: [LAW, PRECEDENT] }
        query: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/LegalSearchItem' }
    LegalSearchSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LegalSearchResult' }
        traceId: { type: [string, 'null'] }
    LegalDocument:
      allOf:
        - $ref: '#/components/schemas/LegalSearchItem'
        - type: object
          required: [type, normalizedText]
          properties:
            type: { type: string, enum: [LAW, PRECEDENT] }
            normalizedText: { type: string }
    LegalDocumentSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LegalDocument' }
        traceId: { type: [string, 'null'] }
    ApiError:
      type: object
      required: [success, code, message, occurredAt]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        message: { type: string }
        traceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
