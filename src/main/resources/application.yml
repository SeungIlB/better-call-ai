spring:
  application:
    name: casecraft-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_ai}
    username: ${DATABASE_APP_USER:legal_ai_app}
    password: ${DATABASE_APP_PASSWORD:app_dev_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_ai}
    user: ${DATABASE_MIGRATION_USER:legal_ai_migrator}
    password: ${DATABASE_MIGRATION_PASSWORD:migrator_dev_only}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
