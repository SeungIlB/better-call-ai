spring:
  application:
    name: better-call-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_ai}
    username: ${DATABASE_APP_USER:legal_ai_app}
    password: ${DATABASE_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_ai}
    user: ${DATABASE_MIGRATION_USER:legal_ai_migrator}
    password: ${DATABASE_MIGRATION_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

security:
  jwt:
    audience: ${JWT_AUDIENCE:better-call-ai}

integrations:
  law-open-data:
    base-url: ${LAW_OPEN_DATA_BASE_URL:https://www.law.go.kr/DRF}
    oc: ${LAW_OPEN_DATA_OC:}
    connect-timeout: ${LAW_OPEN_DATA_CONNECT_TIMEOUT:2s}
    read-timeout: ${LAW_OPEN_DATA_READ_TIMEOUT:5s}
