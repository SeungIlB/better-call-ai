spring:
  application:
    name: better-call-ai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/legal_ai}
    username: ${DATABASE_APP_USER:legal_ai_app}
    password: ${DATABASE_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-init-sql: SET TIME ZONE 'UTC'
  auth-datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/legal_ai}
    username: ${DATABASE_AUTH_USER:legal_ai_auth}
    password: ${DATABASE_AUTH_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_AUTH_POOL_SIZE:5}
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/legal_ai}
    user: ${DATABASE_MIGRATION_USER:legal_ai_migrator}
    password: ${DATABASE_MIGRATION_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8080}

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.apache.pdfbox: ERROR
  pattern:
    correlation: "[%X{traceId:-}] "

security:
  jwt:
    audience: ${JWT_AUDIENCE:better-call-ai}
    key-id: ${JWT_KEY_ID:better-call-ai-local}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  identity:
    encryption-key-id: ${IDENTITY_ENCRYPTION_KEY_ID:local-v1}
    encryption-key-base64: ${IDENTITY_ENCRYPTION_KEY_BASE64:}
    lookup-key-base64: ${IDENTITY_LOOKUP_KEY_BASE64:}

integrations:
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:}
    ocr-model: ${OPENAI_OCR_MODEL:${OPENAI_CHAT_MODEL:}}
    ocr-reasoning-effort: ${OPENAI_OCR_REASONING_EFFORT:}
    ocr-timeout: ${OPENAI_OCR_TIMEOUT_SECONDS:90}s
  clamav:
    host: ${CLAMAV_HOST:127.0.0.1}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:10000}
  law-open-data:
    base-url: ${LAW_OPEN_DATA_BASE_URL:https://www.law.go.kr/DRF}
    oc: ${LAW_OPEN_DATA_OC:}
    connect-timeout: ${LAW_OPEN_DATA_CONNECT_TIMEOUT:2s}
    read-timeout: ${LAW_OPEN_DATA_READ_TIMEOUT:5s}

storage:
  local:
    root: ${UPLOAD_TEMP_DIR:./storage/temp-originals}
    cleanup-enabled: true
    cleanup-delay-ms: 60000
