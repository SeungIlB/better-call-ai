name: backend-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate and test
        run: ./gradlew clean test --no-daemon

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
          test -n "$LIGHTSAIL_SSH_KEY"
          test -n "$LIGHTSAIL_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > ~/.ssh/lightsail_key
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lightsail_key ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        shell: bash
        run: |
          ssh -i ~/.ssh/lightsail_key -o BatchMode=yes "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" <<'REMOTE'
            set -euo pipefail
            cd "$HOME/apps/better-call-ai"
            GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main
            docker compose config --quiet
            docker compose up -d --build

            for attempt in $(seq 1 30); do
              response=$(curl --fail --silent http://127.0.0.1:8080/actuator/health || true)
              if printf '%s' "$response" | grep -q '"status":"UP"'; then
                printf '%s\n' "$response"
                exit 0
              fi
              sleep 2
            done

            docker compose ps
            docker compose logs --tail=100 app
            exit 1
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            https://52-79-143-34.sslip.io/actuator/health)
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"status":"UP"'
